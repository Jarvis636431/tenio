name: CI

on:
  push:
    branches:
      - main
      - tenio-lite
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_AI_SERVICE_URL: ${{ vars.VITE_AI_SERVICE_URL }}
          VITE_RESOURCE_BASE_URL: ${{ vars.VITE_RESOURCE_BASE_URL }}
          VITE_VOLC_APP_ID: ${{ secrets.VITE_VOLC_APP_ID }}
          VITE_VOLC_ACCESS_TOKEN: ${{ secrets.VITE_VOLC_ACCESS_TOKEN }}
          VITE_VOLC_SECRET_KEY: ${{ secrets.VITE_VOLC_SECRET_KEY }}
          VITE_ANALYTICS_ENABLED: ${{ vars.VITE_ANALYTICS_ENABLED }}
          VITE_ANALYTICS_DEBUG: ${{ vars.VITE_ANALYTICS_DEBUG }}
          VITE_ANALYTICS_ENDPOINT: ${{ vars.VITE_ANALYTICS_ENDPOINT }}
          VITE_ANALYTICS_PROVIDER: ${{ vars.VITE_ANALYTICS_PROVIDER }}
